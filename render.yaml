services:
  - type: web
    name: kelivo-file-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FILE_TTL_HOURS
        value: "24"
      - key: MAX_CONTENT_BYTES
        value: "3000000"
